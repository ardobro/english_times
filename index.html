<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Grammar — играй и учись</title>
<style>
@property --theme-1 { syntax: '<color>'; inherits: true; initial-value: #764ba2; }
@property --theme-2 { syntax: '<color>'; inherits: true; initial-value: #667eea; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
body {
  min-height: 100vh;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  background-attachment: fixed;
  padding: 18px 12px 40px; color: #333;
  transition: background 0.8s ease;
}
body[data-zone="past"] { background: linear-gradient(135deg, #f59e0b, #ef4444); }
body[data-zone="future"] { background: linear-gradient(135deg, #3b82f6, #06b6d4); }
body[data-zone="grammar"] { background: linear-gradient(135deg, #10b981, #0ea5e9); }
body[data-zone="stats"] { background: linear-gradient(135deg, #6366f1, #8b5cf6); }

.app {
  max-width: 940px; margin: 0 auto; background: #fff;
  border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  overflow: hidden;
  --theme-1: #764ba2; --theme-2: #667eea;
  transition: --theme-1 0.7s, --theme-2 0.7s;
}
.app[data-zone="past"] { --theme-1: #ef4444; --theme-2: #f59e0b; }
.app[data-zone="future"] { --theme-1: #06b6d4; --theme-2: #3b82f6; }
.app[data-zone="grammar"] { --theme-1: #10b981; --theme-2: #0ea5e9; }
.app[data-zone="stats"] { --theme-1: #6366f1; --theme-2: #8b5cf6; }

header {
  background: linear-gradient(135deg, var(--theme-1), var(--theme-2));
  padding: 13px 18px; color: #fff;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  transition: background 0.7s;
}
.user-block { display: flex; align-items: center; gap: 11px; flex: 1; min-width: 150px; }
.avatar {
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(255,255,255,0.22); border: 2px solid rgba(255,255,255,0.5);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0; cursor: pointer;
  transition: transform 0.25s; backdrop-filter: blur(6px);
}
.avatar:hover { transform: scale(1.08) rotate(-4deg); }
.user-name { font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-sub { font-size: 11px; opacity: 0.85; }

.header-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }
.icon-btn {
  background: rgba(255,255,255,0.18);
  border: 1.5px solid rgba(255,255,255,0.35);
  color: #fff; width: 36px; height: 36px;
  border-radius: 50%; cursor: pointer; font-size: 15px;
  transition: all 0.2s; display: flex; align-items: center; justify-content: center;
  position: relative;
}
.icon-btn:hover { background: rgba(255,255,255,0.32); transform: translateY(-1px); }
.icon-btn.active { background: rgba(255,255,255,0.4); box-shadow: 0 0 0 2px rgba(255,255,255,0.6); }
.icon-btn.lang-btn { width: auto; padding: 0 12px; border-radius: 999px; font-size: 12px; font-weight: 800; }
.icon-btn .dot {
  position: absolute; top: -3px; right: -3px;
  background: #ef4444; color: #fff; border-radius: 50%;
  min-width: 17px; height: 17px; font-size: 10px; font-weight: 800;
  display: none; align-items: center; justify-content: center;
  padding: 0 4px; border: 2px solid var(--theme-1);
}
.icon-btn.has-new .dot { display: flex; animation: bump 0.5s; }
@keyframes bump { 0%{transform:scale(1)} 45%{transform:scale(1.35)} 100%{transform:scale(1)} }

.score-badge {
  background: rgba(255,255,255,0.22);
  border: 1.5px solid rgba(255,255,255,0.4);
  padding: 6px 12px 6px 9px; border-radius: 999px;
  display: flex; align-items: center; gap: 6px;
  font-weight: 800; font-size: 14.5px;
}
.score-badge .s-icon { font-size: 18px; }
.score-badge.bump { animation: bumpScore 0.5s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes bumpScore { 0%{transform:scale(1)} 45%{transform:scale(1.28)} 100%{transform:scale(1)} }

/* ============ MODE SWITCHER ============ */
.mode-switcher {
  display: flex; background: #f4f5ff; padding: 10px 14px; gap: 8px;
  border-bottom: 2px solid #eef1ff;
}
.mode-switcher button {
  flex: 1; padding: 11px 14px;
  border: 2px solid transparent; border-radius: 12px;
  background: #fff; color: #7a7a9a;
  font-size: 13.5px; font-weight: 700; cursor: pointer;
  transition: all 0.25s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.mode-switcher button:hover { background: #eef1ff; color: #4a3b8f; }
.mode-switcher button.active {
  color: #fff;
  background: linear-gradient(135deg, var(--theme-1), var(--theme-2));
  box-shadow: 0 6px 16px color-mix(in srgb, var(--theme-1) 40%, transparent);
}
.mode-switcher button[data-mode="grammar"].active {
  background: linear-gradient(135deg, #10b981, #0ea5e9);
  box-shadow: 0 6px 16px rgba(16,185,129,0.4);
}

/* ============ TIMELINE ============ */
.timeline-scroll {
  overflow-x: auto;
  background: linear-gradient(180deg, #fafbff 0%, #f4f5ff 100%);
  border-bottom: 2px solid #eef1ff;
  scrollbar-width: thin; scrollbar-color: #c5c8e8 transparent;
}
.timeline-scroll::-webkit-scrollbar { height: 6px; }
.timeline-scroll::-webkit-scrollbar-thumb { background: #c5c8e8; border-radius: 3px; }
.timeline { min-width: 640px; padding: 12px 20px 16px; position: relative; }
.timeline-head {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase;
  font-weight: 700; color: #8a8aa8; margin-bottom: 4px;
}
.timeline-head span:nth-child(1) { text-align: left; }
.timeline-head span:nth-child(2) { text-align: center; }
.timeline-head span:nth-child(3) { text-align: right; }
.timeline-head .head-now { color: var(--theme-1); transition: color 0.6s; }
.timeline-axis-wrap { position: relative; height: 22px; margin-bottom: 10px; }
.timeline-axis {
  position: absolute; top: 50%; left: 10px; right: 10px;
  height: 4px; border-radius: 2px; transform: translateY(-50%);
  background: linear-gradient(90deg,
    #f59e0b 0%, #f59e0b 20%, #ef4444 27%,
    #764ba2 45%, #764ba2 55%,
    #06b6d4 73%, #3b82f6 80%, #3b82f6 100%);
  opacity: 0.55;
}
.timeline-ticks {
  position: absolute; top: 50%; left: 10px; right: 10px;
  height: 0; display: flex; justify-content: space-between;
}
.tick {
  width: 6px; height: 6px;
  background: #fff; border: 2px solid #c5c8e8;
  border-radius: 50%; transform: translate(-50%, -50%);
  transition: all 0.3s;
}
.tick.zone-past { border-color: #f59e0b; }
.tick.zone-present { border-color: #764ba2; }
.tick.zone-future { border-color: #3b82f6; }
.tick.active { transform: translate(-50%, -50%) scale(1.5); box-shadow: 0 0 12px currentColor; }
.timeline-marker {
  position: absolute; top: 50%; left: 16.67%;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--theme-1);
  transform: translate(-50%, -50%);
  transition: left 0.6s cubic-bezier(0.34,1.56,0.64,1), background 0.6s;
  z-index: 3; pointer-events: none;
  box-shadow: 0 0 0 3px #fff, 0 0 0 5px color-mix(in srgb, var(--theme-1) 50%, transparent), 0 4px 14px color-mix(in srgb, var(--theme-1) 60%, transparent);
}
.timeline-marker::after {
  content: ''; position: absolute; inset: -8px;
  border-radius: 50%; border: 2px solid var(--theme-1);
  animation: pulseRing 2.2s infinite; opacity: 0.7;
}
.timeline-marker.jumping { animation: markerJump 0.7s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes markerJump {
  0% { transform: translate(-50%, -50%) scale(1); }
  40% { transform: translate(-50%, -80%) scale(1.35); }
  70% { transform: translate(-50%, -50%) scale(0.9); }
  100% { transform: translate(-50%, -50%) scale(1); }
}
@keyframes pulseRing {
  0% { transform: scale(0.7); opacity: 0.9; }
  100% { transform: scale(1.7); opacity: 0; }
}

.tense-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.tense-zone { display: flex; flex-direction: column; gap: 6px; }
.tense-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px;
  border: 2px solid #dfe3ff; border-radius: 10px;
  background: #fff; cursor: pointer;
  font-size: 11.5px; font-weight: 600; color: #5b4bb0;
  transition: all 0.2s ease; text-align: left; line-height: 1.2;
  position: relative;
}
.tense-btn[data-zone="past"] { --zone: #f59e0b; }
.tense-btn[data-zone="present"] { --zone: #764ba2; }
.tense-btn[data-zone="future"] { --zone: #3b82f6; }
.tense-btn:hover { border-color: var(--zone); background: #f8f7ff; transform: translateY(-1px); }
.tense-btn.active {
  border-color: var(--zone);
  background: linear-gradient(135deg, var(--zone), color-mix(in srgb, var(--zone) 70%, white));
  color: #fff;
  box-shadow: 0 4px 12px color-mix(in srgb, var(--zone) 35%, transparent);
}
.shape { width: 12px; height: 12px; background: currentColor; flex-shrink: 0; }
.shape.simple { border-radius: 50%; }
.shape.continuous { width: 22px; border-radius: 11px; }
.shape.perfect { border-radius: 2px; }
.shape.perfect-continuous { width: 20px; border-radius: 10px; transform: skewX(-18deg); }
.t-name { flex: 1; min-width: 0; }

/* ============ GRAMMAR GRID ============ */
.grammar-intro { padding: 22px 22px 6px; text-align: center; }
.grammar-intro h2 { font-size: 22px; color: #10b981; margin-bottom: 6px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.grammar-intro p { color: #888; font-size: 14px; margin-bottom: 4px; }
.grammar-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 12px; padding: 20px 22px 28px;
}
.grammar-card {
  padding: 18px 16px; border-radius: 18px;
  border: 2px solid #e0f2f1;
  background: linear-gradient(135deg, #f0fdfa, #ecfeff);
  cursor: pointer; transition: all 0.25s;
  position: relative; overflow: hidden; text-align: center;
}
.grammar-card::before {
  content: ''; position: absolute; inset: 0;
  opacity: 0; transition: opacity 0.3s;
  background: linear-gradient(135deg, color-mix(in srgb, var(--card-color) 15%, transparent), color-mix(in srgb, var(--card-color) 5%, transparent));
}
.grammar-card:hover { transform: translateY(-4px); border-color: var(--card-color); box-shadow: 0 14px 30px color-mix(in srgb, var(--card-color) 25%, transparent); }
.grammar-card:hover::before { opacity: 1; }
.grammar-icon { font-size: 40px; margin-bottom: 8px; display: block; }
.grammar-name { font-size: 15px; font-weight: 800; color: #1e40af; margin-bottom: 6px; position: relative; }
.grammar-desc { font-size: 12px; color: #6b7280; line-height: 1.4; position: relative; }

/* ============ SUB-NAV ============ */
nav.sub-nav {
  display: flex; background: #fafbff; border-bottom: 2px solid #eef1ff;
  padding: 0 6px; overflow-x: auto; scrollbar-width: none;
}
nav.sub-nav::-webkit-scrollbar { display: none; }
nav.sub-nav button {
  flex: 1 0 auto; padding: 11px 12px;
  border: none; background: transparent;
  cursor: pointer; font-size: 13px; font-weight: 600;
  color: #8a8aa8; transition: all 0.2s;
  border-radius: 10px 10px 0 0;
  margin: 6px 3px 0; white-space: nowrap;
}
nav.sub-nav button:hover { background: #eef1ff; color: #4a3b8f; }
nav.sub-nav button.active {
  color: var(--theme-1); background: #fff;
  box-shadow: 0 -3px 0 var(--theme-1) inset;
  transition: box-shadow 0.5s, color 0.5s;
}
nav.sub-nav button[data-sub="advanced"].active { box-shadow: 0 -3px 0 #ef4444 inset; color: #b91c1c; }

/* ============ PANELS ============ */
.topic { display: none; }
.topic.active { display: block; }
.topic.active.slide-from-right { animation: slideR 0.4s cubic-bezier(0.22,1,0.36,1); }
.topic.active.slide-from-left { animation: slideL 0.4s cubic-bezier(0.22,1,0.36,1); }
@keyframes slideR { from { opacity: 0; transform: translateX(35px); } to { opacity: 1; transform: translateX(0); } }
@keyframes slideL { from { opacity: 0; transform: translateX(-35px); } to { opacity: 1; transform: translateX(0); } }

.subtab { display: none; padding: 22px 22px 28px; }
.subtab.active { display: block; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* ============ THEORY ============ */
.theory h2 { font-size: 20px; color: var(--theme-1); margin-bottom: 10px; padding-bottom: 8px; border-bottom: 2px solid #eef1ff; transition: color 0.5s; }
.theory h3 { font-size: 16px; color: #5b4bb0; margin: 18px 0 8px; }
.theory p { line-height: 1.6; margin-bottom: 9px; font-size: 14.5px; }
.theory ul, .theory ol { margin: 6px 0 10px 20px; line-height: 1.65; font-size: 14.5px; }
.theory li { margin-bottom: 4px; }
.theory b { color: #4a3b8f; }
.theory code, .theory .en {
  background: #eef1ff; padding: 2px 6px; border-radius: 5px;
  font-family: 'Consolas', monospace; color: #4a3b8f; font-size: 13.5px;
}
.formula {
  background: linear-gradient(135deg, #eef1ff, #e6eaff);
  border-left: 5px solid var(--theme-1);
  padding: 12px 16px; border-radius: 12px;
  font-size: 15px; font-weight: 600; color: #4a3b8f;
  text-align: center; margin: 12px 0; transition: border-color 0.5s;
}
.tip { background: #fff8e1; border-left: 5px solid #ffb300; padding: 11px 14px; border-radius: 10px; margin: 12px 0; font-size: 14px; line-height: 1.55; }
.tip b { color: #b57200; }
.example { background: #f6f8ff; border-radius: 10px; padding: 11px 14px; margin: 8px 0; font-size: 14.5px; line-height: 1.65; }
.idiom-table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 14px; }
.idiom-table td { padding: 8px 10px; border-bottom: 1px solid #eef1ff; vertical-align: top; }
.idiom-table td:first-child { font-weight: 700; color: #4a3b8f; white-space: nowrap; }
.idiom-table tr:last-child td { border-bottom: none; }
table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 14px; border-radius: 10px; overflow: hidden; }
th, td { padding: 9px 11px; text-align: left; border-bottom: 1px solid #eef1ff; }
th { background: #eef1ff; color: #4a3b8f; font-weight: 700; }
tr:last-child td { border-bottom: none; }

/* ============ QUIZ ============ */
.quiz { padding: 4px 0; }
.quiz-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; font-size: 13.5px; color: #666; }
.quiz-header b { color: var(--theme-1); transition: color 0.5s; }
.mode-badge { font-size: 10.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; letter-spacing: 0.5px; text-transform: uppercase; }
.mode-badge.basic { background: #eef1ff; color: #4a3b8f; }
.mode-badge.advanced { background: #fee2e2; color: #b91c1c; }
.mode-badge.exam { background: #fef3c7; color: #92400e; }
.mode-badge.ielts { background: #dbeafe; color: #1e40af; }
.mode-badge.ielts-hard { background: #fce7f3; color: #9f1239; }
.progress-bar { width: 100%; height: 8px; background: #e6e6f5; border-radius: 4px; overflow: hidden; margin-bottom: 16px; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--theme-2), var(--theme-1)); width: 0%; transition: width 0.4s ease, background 0.5s; }
.progress-fill.advanced { background: linear-gradient(90deg, #ef4444, #f59e0b); }
.progress-fill.exam { background: linear-gradient(90deg, #f59e0b, #ef4444); }
.progress-fill.ielts { background: linear-gradient(90deg, #3b82f6, #06b6d4); }
.progress-fill.ielts-hard { background: linear-gradient(90deg, #ec4899, #3b82f6); }
.card {
  background: linear-gradient(135deg, #f6f8ff 0%, #eef1ff 100%);
  border-radius: 16px; padding: 22px 18px; min-height: 100px;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center; text-align: center;
  border: 2px solid #dfe3ff; margin-bottom: 16px;
}
.question { font-size: 18.5px; font-weight: 600; color: #333; line-height: 1.5; }
.question-hint { font-size: 12.5px; color: #8a8aa8; margin-top: 6px; font-style: italic; }
.question .blank { display: inline-block; min-width: 60px; border-bottom: 2px dashed var(--theme-1); color: var(--theme-1); font-weight: 700; }
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.option {
  padding: 14px 12px; border: 2px solid #dfe3ff; border-radius: 12px;
  background: #fff; cursor: pointer;
  font-size: 14.5px; font-weight: 500;
  transition: all 0.2s ease; color: #333;
  text-align: center; line-height: 1.35;
}
.option:hover:not(.disabled) { border-color: var(--theme-1); background: #f6f4ff; transform: translateY(-2px); }
.option.correct { background: #d4f8d4; border-color: #34a853; color: #1b5e20; }
.option.wrong { background: #ffd6d6; border-color: #e53935; color: #b71c1c; }
.option.disabled { cursor: default; opacity: 0.95; }
.input-row { display: flex; gap: 8px; margin-bottom: 12px; }
.input-answer {
  flex: 1; padding: 14px 16px;
  border: 2px solid #dfe3ff; border-radius: 12px;
  font-size: 15.5px; font-weight: 500; font-family: inherit;
  outline: none; background: #fff; transition: border-color 0.2s;
}
.input-answer:focus { border-color: var(--theme-1); box-shadow: 0 0 0 4px color-mix(in srgb, var(--theme-1) 15%, transparent); }
.input-answer.correct { background: #d4f8d4; border-color: #34a853; color: #1b5e20; }
.input-answer.wrong { background: #ffd6d6; border-color: #e53935; color: #b71c1c; }
.check-btn {
  padding: 14px 20px; border: none; border-radius: 12px;
  background: linear-gradient(135deg, var(--theme-2), var(--theme-1));
  color: #fff; font-size: 14.5px; font-weight: 700;
  cursor: pointer; transition: all 0.2s; flex-shrink: 0;
}
.check-btn:hover:not(:disabled) { transform: translateY(-2px); }
.check-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.reorder-built {
  min-height: 54px; padding: 10px;
  border: 2px dashed #c5c8e8; border-radius: 12px;
  background: #fafbff; display: flex; flex-wrap: wrap; gap: 8px;
  align-items: center; margin-bottom: 12px; transition: all 0.2s;
}
.reorder-built.correct { border-color: #34a853; background: #eafbe9; border-style: solid; }
.reorder-built.wrong { border-color: #e53935; background: #fdecec; border-style: solid; }
.reorder-built:empty::after { content: attr(data-placeholder); color: #b0b3d0; font-size: 12.5px; font-style: italic; }
.reorder-pool { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; min-height: 42px; }
.word-chip {
  padding: 9px 14px; border: 2px solid #dfe3ff; border-radius: 11px;
  background: #fff; font-size: 14.5px; font-weight: 600;
  color: #4a3b8f; cursor: pointer; transition: all 0.15s; user-select: none;
}
.word-chip:hover { transform: translateY(-2px); border-color: var(--theme-1); background: #f6f4ff; }
.word-chip.used { opacity: 0.22; pointer-events: none; }
.word-chip.in-built { background: linear-gradient(135deg, #eef1ff, #dfe3ff); border-color: var(--theme-1); }
.word-chip.in-built:hover { background: #ffe0e0; border-color: #ef4444; }
.feedback { text-align: center; font-size: 14px; min-height: 22px; margin-bottom: 12px; font-weight: 600; line-height: 1.5; }
.feedback.ok { color: #2e7d32; }
.feedback.no { color: #c62828; }
.btn {
  width: 100%; padding: 13px;
  border: none; border-radius: 12px;
  background: linear-gradient(135deg, var(--theme-2), var(--theme-1));
  color: #fff; font-size: 15.5px; font-weight: 600;
  cursor: pointer; transition: all 0.2s ease;
}
.btn:hover:not(:disabled) { transform: translateY(-2px); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.advanced { background: linear-gradient(135deg, #ef4444, #f59e0b); }
.btn.exam { background: linear-gradient(135deg, #f59e0b, #ef4444); }
.btn.ielts { background: linear-gradient(135deg, #3b82f6, #06b6d4); }
.btn.ielts-hard { background: linear-gradient(135deg, #ec4899, #3b82f6); }
.btn.outline { background: #fff; color: var(--theme-1); border: 2px solid var(--theme-1); }
.btn.outline:hover:not(:disabled) { background: #f6f4ff; }
.result-screen { text-align: center; padding: 18px 10px; }
.result-emoji { font-size: 58px; margin-bottom: 10px; animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes popIn {
  0% { transform: scale(0); opacity: 0; }
  60% { transform: scale(1.25); }
  100% { transform: scale(1); opacity: 1; }
}
.result-title { font-size: 22px; color: var(--theme-1); margin-bottom: 10px; }
.result-score { font-size: 17px; color: #555; margin-bottom: 8px; font-weight: 600; }
.result-reward {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 20px; border-radius: 999px;
  background: linear-gradient(135deg, #fff8e1, #ffe9a8);
  border: 2px solid #f59e0b; color: #b57200;
  font-weight: 800; font-size: 16px; margin-bottom: 12px;
  animation: popIn 0.7s 0.2s both cubic-bezier(0.34,1.56,0.64,1);
}
.result-msg { font-size: 14.5px; color: #888; margin-bottom: 18px; line-height: 1.5; }
.result-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.result-actions .btn { flex: 1; min-width: 130px; }

/* ============ SECTIONS ============ */
.section-wrap { padding: 24px 22px 30px; }
.section-wrap h2 { font-size: 22px; color: var(--theme-1); margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
.section-wrap > p { color: #888; font-size: 14.5px; margin-bottom: 18px; line-height: 1.5; }
.exam-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
.exam-card {
  padding: 18px 16px; border-radius: 16px;
  border: 2px solid #dfe3ff;
  background: linear-gradient(135deg, #fafbff, #f0f4ff);
  cursor: pointer; transition: all 0.25s;
  position: relative; overflow: hidden;
}
.exam-card:hover { transform: translateY(-3px); border-color: var(--theme-1); box-shadow: 0 12px 28px rgba(118,75,162,0.18); }
.exam-icon { font-size: 38px; margin-bottom: 8px; display: block; }
.exam-name { font-size: 16px; font-weight: 800; color: #4a3b8f; margin-bottom: 5px; }
.exam-desc { font-size: 12.5px; color: #8a8aa8; line-height: 1.45; margin-bottom: 10px; }
.exam-meta { display: flex; gap: 6px; flex-wrap: wrap; }
.exam-chip {
  font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
  background: #fff; color: #5b4bb0; border: 1.5px solid #dfe3ff;
}
.exam-chip.hot { background: #fee2e2; color: #b91c1c; border-color: #fecaca; }
.exam-chip.ielts { background: #dbeafe; color: #1e40af; border-color: #bfdbfe; }

/* ============ STATS ============ */
.stats-overview {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
  margin-bottom: 22px;
}
.stat-tile {
  padding: 16px 14px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eef1ff, #e0e7ff);
  border: 2px solid #dbeafe;
  text-align: center;
  transition: transform 0.2s;
}
.stat-tile:hover { transform: translateY(-2px); }
.stat-tile.highlight {
  background: linear-gradient(135deg, #fff8e1, #ffe9a8);
  border-color: #f59e0b;
}
.stat-tile-icon { font-size: 28px; margin-bottom: 4px; }
.stat-tile-value { font-size: 24px; font-weight: 800; color: #4a3b8f; line-height: 1.1; }
.stat-tile-label { font-size: 11.5px; color: #6b7280; margin-top: 4px; font-weight: 600; }

.stats-section-title {
  font-size: 16px;
  font-weight: 800;
  color: #4a3b8f;
  margin: 22px 0 10px;
  display: flex; align-items: center; gap: 8px;
}
.stats-list { display: flex; flex-direction: column; gap: 8px; }
.stat-row {
  padding: 12px 14px;
  border-radius: 12px;
  background: #fafbff;
  border: 2px solid #eef1ff;
  display: flex; flex-direction: column; gap: 6px;
  transition: all 0.2s;
}
.stat-row:hover { border-color: var(--theme-1); background: #f6f4ff; }
.stat-row-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.stat-row-name { font-weight: 700; color: #4a3b8f; font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
.stat-row-icon { font-size: 16px; }
.stat-row-score {
  font-size: 12.5px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 999px;
  background: #eef1ff;
  color: #4a3b8f;
}
.stat-row-score.good { background: #d4f8d4; color: #1b5e20; }
.stat-row-score.medium { background: #fef3c7; color: #92400e; }
.stat-row-score.low { background: #fee2e2; color: #b91c1c; }
.stat-row-score.empty { background: #f3f4f6; color: #9ca3af; }
.stat-bar-wrap { width: 100%; height: 8px; background: #e6e6f5; border-radius: 4px; overflow: hidden; display: flex; }
.stat-bar {
  height: 100%; transition: width 0.6s cubic-bezier(0.22,1,0.36,1);
  display: flex; align-items: center; justify-content: center;
}
.stat-bar.basic { background: linear-gradient(90deg, #667eea, #764ba2); }
.stat-bar.advanced { background: linear-gradient(90deg, #ef4444, #f59e0b); }
.stat-bar-exact {
  font-size: 11px; color: #6b7280; margin-left: 8px; font-weight: 600;
}
.stat-row-detail {
  font-size: 11.5px; color: #8a8aa8;
  display: flex; gap: 12px; flex-wrap: wrap;
}
.stat-row-detail span { display: flex; align-items: center; gap: 4px; }

.stats-empty {
  text-align: center;
  padding: 40px 20px;
  color: #8a8aa8;
}
.stats-empty-icon { font-size: 52px; margin-bottom: 12px; opacity: 0.6; }
.stats-empty-text { font-size: 14px; line-height: 1.5; }

.stats-tabs {
  display: flex; gap: 6px;
  margin: 8px 0 14px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 4px;
}
.stats-tabs::-webkit-scrollbar { display: none; }
.stats-tab {
  padding: 8px 14px;
  border-radius: 999px;
  border: 2px solid #eef1ff;
  background: #fafbff;
  font-size: 12.5px;
  font-weight: 700;
  color: #6b7280;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.stats-tab:hover { border-color: var(--theme-1); color: var(--theme-1); }
.stats-tab.active {
  background: linear-gradient(135deg, var(--theme-1), var(--theme-2));
  color: #fff;
  border-color: transparent;
}

/* ============ ACHIEVEMENTS ============ */
.ach-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 11px; margin-top: 16px; max-height: 60vh; overflow-y: auto; padding: 4px;
}
.ach-card {
  padding: 13px 10px; border-radius: 14px; text-align: center;
  border: 2px solid #eef1ff; background: #fafbff;
  transition: all 0.2s; position: relative;
}
.ach-card.unlocked { background: linear-gradient(135deg, #fff8e1, #ffe9a8); border-color: #f59e0b; }
.ach-card.locked { opacity: 0.55; }
.ach-icon { font-size: 30px; margin-bottom: 6px; filter: grayscale(1); }
.ach-card.unlocked .ach-icon { filter: none; }
.ach-name { font-size: 12.5px; font-weight: 800; color: #4a3b8f; margin-bottom: 3px; }
.ach-desc { font-size: 11px; color: #8a8aa8; line-height: 1.3; margin-bottom: 6px; }
.ach-reward { font-size: 11px; font-weight: 800; color: #b57200; background: rgba(245,158,11,0.15); padding: 3px 8px; border-radius: 999px; display: inline-block; }
.ach-card.locked .ach-reward { color: #8a8aa8; background: #eef1ff; }
.ach-locked-tag { position: absolute; top: 8px; right: 10px; font-size: 14px; opacity: 0.7; }

/* ============ MODALS ============ */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(40, 25, 80, 0.75);
  backdrop-filter: blur(8px);
  z-index: 10001;
  display: flex; justify-content: center; align-items: center;
  padding: 18px; animation: fadeIn 0.3s ease;
}
.modal-card {
  background: #fff; border-radius: 22px;
  padding: 30px 24px 24px;
  max-width: 440px; width: 100%; text-align: center;
  box-shadow: 0 30px 70px rgba(0,0,0,0.4);
  animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
  max-height: calc(100vh - 40px); overflow-y: auto;
}
.modal-emoji { font-size: 52px; margin-bottom: 8px; }
.modal-title { font-size: 22px; color: var(--theme-1); margin-bottom: 6px; font-weight: 800; }
.modal-sub { font-size: 14px; color: #888; margin-bottom: 18px; line-height: 1.5; }
.name-input {
  width: 100%; padding: 13px 16px;
  border: 2px solid #dfe3ff; border-radius: 12px;
  font-size: 15px; font-weight: 600; font-family: inherit;
  text-align: center; outline: none;
  transition: border-color 0.2s; color: #4a3b8f;
}
.name-input:focus { border-color: var(--theme-1); }
.name-input::placeholder { color: #c5c8e8; font-weight: 500; }
.emoji-picker-label { font-size: 13px; font-weight: 700; color: #5b4bb0; margin: 16px 0 8px; text-align: left; }
.emoji-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.emoji-opt {
  aspect-ratio: 1; border: 2px solid #eef1ff; border-radius: 12px;
  background: #fafbff; font-size: 24px; cursor: pointer;
  transition: all 0.15s; display: flex; align-items: center; justify-content: center; padding: 0;
}
.emoji-opt:hover { transform: scale(1.1); border-color: var(--theme-1); background: #f6f4ff; }
.emoji-opt.selected { border-color: var(--theme-1); background: color-mix(in srgb, var(--theme-1) 12%, white); box-shadow: 0 4px 12px color-mix(in srgb, var(--theme-1) 25%, transparent); }

/* ============ TOASTS ============ */
#toastLayer { position: fixed; top: 16px; right: 16px; z-index: 10002; display: flex; flex-direction: column; gap: 10px; pointer-events: none; max-width: calc(100vw - 32px); }
.toast {
  background: linear-gradient(135deg, #fff8e1, #ffe9a8);
  border: 2px solid #f59e0b; border-radius: 14px;
  padding: 13px 15px; min-width: 240px; max-width: 330px;
  box-shadow: 0 12px 32px rgba(245, 158, 11, 0.45);
  transform: translateX(400px) scale(0.9); opacity: 0;
  transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
  display: flex; gap: 11px; align-items: center;
}
.toast.show { transform: translateX(0) scale(1); opacity: 1; }
.toast-icon { font-size: 32px; flex-shrink: 0; }
.toast-title { font-size: 13.5px; font-weight: 800; color: #b57200; margin-bottom: 2px; }
.toast-desc { font-size: 12px; color: #7a5a00; line-height: 1.3; }
.toast-reward { font-size: 11.5px; font-weight: 800; color: #b57200; margin-top: 3px; }

/* ============ PARTICLES ============ */
#particleLayer { position: fixed; inset: 0; pointer-events: none; z-index: 10003; overflow: hidden; }
.particle { position: fixed; font-size: 20px; transform: translate(-50%, -50%); pointer-events: none; will-change: transform, opacity; user-select: none; }

.hidden { display: none !important; }

@media (max-width: 700px) {
  .exam-grid { grid-template-columns: 1fr; }
  .emoji-grid { grid-template-columns: repeat(5, 1fr); }
  .grammar-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .grammar-card { padding: 14px 10px; }
  .grammar-icon { font-size: 32px; }
  .grammar-name { font-size: 13.5px; }
  .grammar-desc { font-size: 11px; }
  .stats-overview { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 640px) {
  .options { grid-template-columns: 1fr; }
  .question { font-size: 16.5px; }
  .subtab { padding: 16px 14px 22px; }
  .section-wrap { padding: 18px 14px 22px; }
  table { font-size: 13px; }
  th, td { padding: 7px 8px; }
  nav.sub-nav button { font-size: 12px; padding: 9px 8px; }
  .timeline { padding: 10px 14px 14px; min-width: 560px; }
  .tense-btn { font-size: 10.5px; padding: 7px 8px; gap: 6px; }
  header { padding: 10px 12px; }
  .user-sub { display: none; }
  .avatar { width: 42px; height: 42px; font-size: 20px; }
  .icon-btn { width: 34px; height: 34px; font-size: 14px; }
  .mode-switcher { padding: 8px 10px; gap: 6px; }
  .mode-switcher button { font-size: 12px; padding: 9px 8px; }
  .stat-tile-value { font-size: 20px; }
}

function normalize(s) { return String(s).toLowerCase().trim().replace(/\s+/g, ' ').replace(/[.!?,;:]+$/, ''); }
function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function shuffleWords(words) {
  const a = [...words]; if (a.length < 2) return a;
  let tries = 0;
  do { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } tries++; }
  while (a.join(' ') === words.join(' ') && tries < 20);
  return a;
}
function sampleQuestions(pool, count) {
  if (pool.length <= count) return shuffle(pool);
  return shuffle(pool).slice(0, count);
}
function T(ru, en) { return { ru, en }; }

/* =========================================================
   PARTICLES
   ========================================================= */
function spawnBurst(x, y, opts = {}) {
  const count = opts.count ?? 12;
  const emojis = opts.emojis ?? ['🐽', '✨', '⭐'];
  const spread = opts.spread ?? 130;
  const dur = opts.duration ?? 1000;
  const layer = document.getElementById('particleLayer');
  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'particle';
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.fontSize = (14 + Math.random()*16) + 'px';
    layer.appendChild(el);
    const angle = Math.random()*Math.PI*2;
    const dist = spread * (0.4 + Math.random()*0.8);
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist - 50;
    const d = dur * (0.7 + Math.random()*0.6);
    el.animate([
      { transform: 'translate(-50%,-50%) scale(1) rotate(0deg)', opacity: 1 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0.4) rotate(${(Math.random()-0.5)*360}deg)`, opacity: 0 }
    ], { duration: d, easing: 'cubic-bezier(0.15,0.7,0.4,1)' }).onfinish = () => el.remove();
  }
}
function bigCelebration() {
  const w = window.innerWidth, h = window.innerHeight;
  spawnBurst(w/2, h/2, { count: 40, emojis: ['🐽','✨','⭐','🎉','💫'], spread: 320, duration: 1600 });
  setTimeout(() => spawnBurst(w*0.15, h*0.35, { count: 18, emojis: ['🐽','✨','⭐'], spread: 180 }), 200);
  setTimeout(() => spawnBurst(w*0.85, h*0.35, { count: 18, emojis: ['🐽','✨','⭐'], spread: 180 }), 320);
}
function themeTransitionBurst(x, y, zone) {
  const colors = { past: ['🔥','✨','🌟'], present: ['✨','💫','⭐'], future: ['🌊','✨','💫'], grammar: ['📚','✨','🌟'], stats: ['📊','✨','💫'] };
  spawnBurst(x, y, { count: 14, emojis: colors[zone] || ['✨'], spread: 130, duration: 900 });
}

/* =========================================================
   TOASTS
   ========================================================= */
function showToast({ icon, title, desc, reward }) {
  const layer = document.getElementById('toastLayer');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = `
    <div class="toast-icon">${icon}</div>
    <div class="toast-body">
      <div class="toast-title">${title}</div>
      <div class="toast-desc">${desc}</div>
      ${reward ? `<div class="toast-reward">+${reward} 🐽</div>` : ''}
    </div>
  `;
  layer.appendChild(toast);
  requestAnimationFrame(() => toast.classList.add('show'));
  setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 500); }, 4500);
}
function showAchievementToast(a) {
  showToast({ icon: a.icon, title: `🏆 ${achName(a)}`, desc: achDesc(a), reward: a.reward });
  const badge = document.getElementById('scoreBadge');
  if (badge) {
    const r = badge.getBoundingClientRect();
    spawnBurst(r.left + r.width/2, r.top + r.height/2, { count: 24, emojis: ['🐽','✨','⭐','🎉'], spread: 200, duration: 1400 });
  }
  markNewAchievement();
}

function updateHeader() {

  document.getElementById('avatar').textContent = state.avatar || '🐷';
  document.getElementById('userSub').textContent = t('userSub', { n: state.answeredQuestions });

function bumpScoreBadge() {
  const badge = document.getElementById('scoreBadge');
  badge.classList.remove('bump'); void badge.offsetWidth; badge.classList.add('bump');
}
function addFuntiki(amount, x, y) {
  state.totalFuntiki += amount;
  saveState();
  document.getElementById('scoreValue').textContent = state.totalFuntiki;
  bumpScoreBadge();
  if (x != null && y != null) spawnBurst(x, y, { count: Math.min(12, 3 + amount*2), emojis: ['🐽','✨'], spread: 90 });
  updateHeader();
}

  if (done >= 1) toUnlock.push('first_steps');
  if (Object.values(s.bestBasic).some(v => v >= SESSION_BASIC)) toUnlock.push('perfect_basic');
  if (Object.values(s.bestAdvanced).some(v => v >= SESSION_ADVANCED)) toUnlock.push('perfect_adv');
  if (s.completedExam.length >= 1 && Object.values(s.bestExam).some(v => v >= 15)) toUnlock.push('perfect_exam');
  if (s.completedIelts.length >= 1 && Object.values(s.bestIelts).some(v => v >= 8)) toUnlock.push('perfect_ielts');
  if (s.completedGrammarBasic.length + s.completedGrammarAdvanced.length >= 1) toUnlock.push('grammar_first');
  if (s.completedGrammarBasic.length >= GRAMMAR_TOPICS.length && s.completedGrammarAdvanced.length >= GRAMMAR_TOPICS.length) toUnlock.push('grammar_all');
  if (s.completedGrammarBasic.includes('idioms') && s.completedGrammarAdvanced.includes('idioms')) toUnlock.push('idioms_master');
  if (s.completedGrammarBasic.includes('phrasal-verbs') && s.completedGrammarAdvanced.includes('phrasal-verbs')) toUnlock.push('phrasal_pro');
  if (s.completedBasic.length >= 12) toUnlock.push('all_basic');
  if (s.completedAdvanced.length >= 12) toUnlock.push('all_adv');
  if (s.completedExam.length >= 3) toUnlock.push('all_exams');
  if (s.completedIelts.length >= 4) toUnlock.push('all_ielts');
  if (TENSES.every(tt => s.bestBasic[tt.id] >= SESSION_BASIC)) toUnlock.push('perfect_all_basic');
  if (TENSES.every(tt => s.bestAdvanced[tt.id] >= SESSION_ADVANCED)) toUnlock.push('perfect_all_adv');
  if (s.totalFuntiki >= 100) toUnlock.push('hundred');
  if (s.totalFuntiki >= 500) toUnlock.push('fivehundred');
  if (s.totalFuntiki >= 1000) toUnlock.push('thousand');
  if (s.totalFuntiki >= 2000) toUnlock.push('pig_master');
  if (s.answeredQuestions >= 100) toUnlock.push('marathoner');
  if (s.answeredQuestions >= 300) toUnlock.push('super_marathon');

  for (const id of toUnlock) {
    if (!s.achievements.includes(id)) {
      s.achievements.push(id);
      const a = ACHIEVEMENTS.find(x => x.id === id);
      if (a) { s.totalFuntiki += a.reward; setTimeout(() => showAchievementToast(a), 300); }
    }
  }
  if (toUnlock.length) { saveState(); updateHeader(); }
}

/* =========================================================
   TIMELINE
   ========================================================= */
const zones = { past: [], present: [], future: [] };
TENSES.forEach(tt => zones[tt.zone].push(tt));

function buildTimeline() {
  const grid = document.getElementById('tenseGrid');
  grid.innerHTML = '';
  ['past','present','future'].forEach(zoneId => {
    const col = document.createElement('div');
    col.className = 'tense-zone';
    zones[zoneId].forEach(tense => {
      const btn = document.createElement('button');
      btn.className = 'tense-btn';
      btn.dataset.zone = tense.zone;
      btn.dataset.id = tense.id;
      btn.innerHTML = `<span class="shape ${tense.type}"></span><span class="t-name">${tense.name}</span>`;
      btn.addEventListener('click', (e) => switchTense(tense.id, e));
      col.appendChild(btn);
    });
    grid.appendChild(col);
  });
  const ticks = document.getElementById('timelineTicks');
  ticks.innerHTML = '';
  ['past','present','future'].forEach(z => {
    const tk = document.createElement('span');
    tk.className = 'tick zone-' + z;
    tk.dataset.zone = z;
    tk.style.color = { past: '#f59e0b', present: '#764ba2', future: '#3b82f6' }[z];
    ticks.appendChild(tk);
  });
}
function updateTimelineMarker(animate = false) {
  const marker = document.getElementById('timelineMarker');
  const active = document.querySelector('.tense-btn.active');
  const grid = document.getElementById('tenseGrid');
  if (!marker || !active || !grid) return;
  const gridRect = grid.getBoundingClientRect();
  const btnRect = active.getBoundingClientRect();
  const centerX = btnRect.left + btnRect.width/2 - gridRect.left;
  marker.style.left = centerX + 'px';
  const zone = active.dataset.zone;
  const color = { past: '#f59e0b', present: '#764ba2', future: '#3b82f6' }[zone];
  marker.style.background = color;
  document.querySelectorAll('.tick').forEach(tk => tk.classList.toggle('active', tk.dataset.zone === zone));
  if (animate) { marker.classList.remove('jumping'); void marker.offsetWidth; marker.classList.add('jumping'); }
}

/* =========================================================
   TENSE SWITCH
   ========================================================= */
let currentTenseId = 'present-continuous';
let currentGrammarId = null;
function switchTense(newId, event) {
  const oldT = TENSES.find(tt => tt.id === currentTenseId);
  const newT = TENSES.find(tt => tt.id === newId);
  if (!newT) return;
  document.getElementById('examsWrap').classList.add('hidden');
  document.getElementById('ieltsWrap').classList.add('hidden');
  document.getElementById('statsWrap').classList.add('hidden');
  document.getElementById('statsBtn').classList.remove('active');
  document.getElementById('timelineWrap').classList.remove('hidden');

  const app = document.getElementById('app');
  document.body.dataset.zone = newT.zone;
  app.dataset.zone = newT.zone;

  const zoneOrder = { past: 0, present: 1, future: 2 };
  const dir = oldT && zoneOrder[newT.zone] < zoneOrder[oldT.zone] ? 'left' : 'right';
  document.querySelectorAll('#topicsWrap .topic').forEach(p => p.classList.remove('active', 'slide-from-right', 'slide-from-left'));
  document.getElementById('topic-' + newId).classList.add('active', dir === 'left' ? 'slide-from-left' : 'slide-from-right');

  document.querySelectorAll('.tense-btn').forEach(b => b.classList.toggle('active', b.dataset.id === newId));
  updateTimelineMarker(true);
  if (event && event.clientX) themeTransitionBurst(event.clientX, event.clientY, newT.zone);

  const btn = document.querySelector(`.tense-btn[data-id="${newId}"]`);
  const scrollEl = document.querySelector('.timeline-scroll');
  if (btn && scrollEl && scrollEl.scrollWidth > scrollEl.clientWidth) {
    const br = btn.getBoundingClientRect(), sr = scrollEl.getBoundingClientRect();
    const target = br.left - sr.left + scrollEl.scrollLeft - (sr.width - br.width) / 2;
    scrollEl.scrollTo({ left: Math.max(0, target), behavior: 'smooth' });
  }
  currentTenseId = newId;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* =========================================================
   QUIZ CLASS
   ========================================================= */
class Quiz {
  constructor(container, questions, config) {
    this.container = container;
    this.questions = questions;
    this.config = config || {};
    this.mode = config.mode || 'basic';
    this.testKey = config.testKey || 'generic';
    this.kind = config.kind || 'tense';
    this.current = 0;
    this.score = 0;
    this.answered = false;
    this.earnedFuntiki = 0;
    this.render();
    this.loadQuestion();
  }
  getReward() {
    if (this.mode === 'advanced') return FUNTIKI_ADVANCED;
    if (this.mode === 'exam-basic') return FUNTIKI_EXAM_BASIC;
    if (this.mode === 'exam-advanced') return FUNTIKI_EXAM_ADV;
    if (this.mode === 'exam-mega') return FUNTIKI_EXAM_MEGA;
    if (this.mode === 'ielts') return FUNTIKI_IELTS;
    if (this.mode === 'ielts-hard') return FUNTIKI_IELTS_HARD;
    return FUNTIKI_BASIC;
  }
  getPerfectBonus() {
    if (this.mode === 'advanced') return BONUS_PERFECT_ADV;
    if (this.mode.startsWith('exam')) return BONUS_PERFECT_EXAM;
    if (this.mode.startsWith('ielts')) return BONUS_PERFECT_IELTS;
    return BONUS_PERFECT_BASIC;
  }
  getBtnClass() {
    if (this.mode === 'advanced') return 'advanced';
    if (this.mode.startsWith('exam')) return 'exam';
    if (this.mode === 'ielts') return 'ielts';
    if (this.mode === 'ielts-hard') return 'ielts-hard';
    return '';
  }
  getFillClass() {
    if (this.mode === 'advanced') return 'advanced';
    if (this.mode.startsWith('exam')) return 'exam';
    if (this.mode === 'ielts') return 'ielts';
    if (this.mode === 'ielts-hard') return 'ielts-hard';
    return '';
  }
  render() {
    const mode = this.mode;
    let modeClass = 'basic', modeText = t('modeBasic');
    if (mode === 'advanced') { modeClass = 'advanced'; modeText = t('modeAdvanced'); }
    else if (mode === 'exam-basic') { modeClass = 'exam'; modeText = t('modeExam'); }
    else if (mode === 'exam-advanced') { modeClass = 'exam'; modeText = t('modeExamAdv'); }
    else if (mode === 'exam-mega') { modeClass = 'exam'; modeText = t('modeExamMega'); }
    else if (mode === 'ielts') { modeClass = 'ielts'; modeText = t('modeIelts'); }
    else if (mode === 'ielts-hard') { modeClass = 'ielts-hard'; modeText = t('modeIeltsHard'); }

    const reward = this.getReward();
    const fillClass = this.getFillClass();
    const btnClass = this.getBtnClass();
    this.container.innerHTML = `
      <div class="quiz-header">
        <span class="mode-badge ${modeClass}">${modeText}</span>
        <span>${t('questionLabel')}: <b class="qNum">1</b> / <b class="qTotal">${this.questions.length}</b></span>
        <span style="font-weight:700">+${reward} 🐽</span>
      </div>
      <div class="progress-bar"><div class="progress-fill ${fillClass}"></div></div>
      <div class="gameScreen">
        <div class="card"><div class="question"></div></div>
        <div class="answer-area"></div>
        <div class="feedback"></div>
        <button class="btn nextBtn ${btnClass}" disabled>${t('nextQ')}</button>
      </div>
      <div class="result-screen hidden">
        <div class="result-emoji">🎉</div>
        <div class="result-title">${t('resultDone')}</div>
        <div class="result-score"></div>
        <div class="result-reward hidden"></div>
        <div class="result-msg"></div>
        <div class="result-actions">
          <button class="btn outline restartBtn">${t('again')}</button>
          <button class="btn shareResultBtn">${t('shareBtn')}</button>
        </div>
      </div>
    `;
    this.el = {
      qNum: this.container.querySelector('.qNum'),
      progress: this.container.querySelector('.progress-fill'),
      question: this.container.querySelector('.question'),
      answerArea: this.container.querySelector('.answer-area'),
      feedback: this.container.querySelector('.feedback'),
      nextBtn: this.container.querySelector('.nextBtn'),
      gameScreen: this.container.querySelector('.gameScreen'),
      resultScreen: this.container.querySelector('.result-screen'),
      resultEmoji: this.container.querySelector('.result-emoji'),
      resultTitle: this.container.querySelector('.result-title'),
      resultScore: this.container.querySelector('.result-score'),
      resultReward: this.container.querySelector('.result-reward'),
      resultMsg: this.container.querySelector('.result-msg'),
      restartBtn: this.container.querySelector('.restartBtn'),
      shareBtn: this.container.querySelector('.shareResultBtn'),
    };
    this.el.nextBtn.addEventListener('click', () => this.next());
    this.el.restartBtn.addEventListener('click', () => this.restart());
    this.el.shareBtn.addEventListener('click', () => shareResult(this));
  }
  loadQuestion() {
    this.answered = false;
    const q = this.questions[this.current];
    this.el.qNum.textContent = this.current + 1;
    this.el.feedback.textContent = '';
    this.el.feedback.className = 'feedback';
    this.el.nextBtn.disabled = true;
    this.el.nextBtn.textContent = this.current === this.questions.length - 1 ? t('showResult') : t('nextQ');
    this.el.progress.style.width = (this.current / this.questions.length * 100) + '%';
    this.buildUI(q);
  }
  buildUI(q) {
    const area = this.el.answerArea;
    area.innerHTML = '';
    if (q.options) {
      this.el.question.textContent = q.q;
      const opts = document.createElement('div');
      opts.className = 'options';
      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option';
        btn.textContent = opt;
        btn.addEventListener('click', (e) => this.selectBasic(i, btn, e));
        opts.appendChild(btn);
      });
      area.appendChild(opts);
    } else if (q.type === 'input') {
      this.el.question.innerHTML = q.q.replace('___', '<span class="blank">______</span>');
      const row = document.createElement('div');
      row.className = 'input-row';
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'input-answer';
      input.placeholder = t('placeholderInput');
      input.autocomplete = 'off';
      input.spellcheck = false;
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !input.disabled && input.value.trim()) this.checkInput(); });
      const btn = document.createElement('button');
      btn.className = 'check-btn';
      btn.textContent = t('check');
      btn.disabled = true;
      btn.addEventListener('click', () => this.checkInput());
      input.addEventListener('input', () => { btn.disabled = !input.value.trim(); });
      row.appendChild(input); row.appendChild(btn);
      area.appendChild(row);
      setTimeout(() => input.focus(), 80);
      this._inputEl = input; this._checkBtnEl = btn;
    } else if (q.type === 'reorder') {
      this.el.question.innerHTML = `${q.hint}<div class="question-hint">${state.lang === 'ru' ? 'Собери предложение' : 'Build the sentence'}</div>`;
      this._buildSelected = [];
      this._buildPool = shuffleWords(q.words);
      const built = document.createElement('div');
      built.className = 'reorder-built';
      built.dataset.placeholder = t('placeholderReorder');
      const pool = document.createElement('div');
      pool.className = 'reorder-pool';
      area.appendChild(built); area.appendChild(pool);
      this._builtEl = built; this._poolEl = pool;
      this._buildPool.forEach((w, idx) => {
        const chip = document.createElement('button');
        chip.className = 'word-chip';
        chip.textContent = w;
        chip.dataset.poolIdx = idx;
        chip.addEventListener('click', () => this._addWord(idx));
        pool.appendChild(chip);
      });
    }
  }
  _addWord(poolIdx) {
    if (this.answered) return;
    const word = this._buildPool[poolIdx];
    this._buildSelected.push({ word, poolIdx });
    const poolChip = this._poolEl.querySelector(`[data-pool-idx="${poolIdx}"]`);
    if (poolChip) poolChip.classList.add('used');
    this._refreshBuilt();
    this._updateCheckBtn();
  }
  _removeWord(builtIdx) {
    if (this.answered) return;
    const item = this._buildSelected[builtIdx];
    this._buildSelected.splice(builtIdx, 1);
    const poolChip = this._poolEl.querySelector(`[data-pool-idx="${item.poolIdx}"]`);
    if (poolChip) poolChip.classList.remove('used');
    this._refreshBuilt();
    this._updateCheckBtn();
  }
  _refreshBuilt() {
    this._builtEl.innerHTML = '';
    this._buildSelected.forEach((item, i) => {
      const chip = document.createElement('button');
      chip.className = 'word-chip in-built';
      chip.textContent = item.word;
      chip.addEventListener('click', () => this._removeWord(i));
      this._builtEl.appendChild(chip);
    });
  }
  _updateCheckBtn() {
    let checkBtn = this.container.querySelector('.reorder-check-btn');
    const area = this.el.answerArea;
    if (this._buildSelected.length === 0) {
      if (checkBtn) checkBtn.disabled = true;
    } else {
      if (!checkBtn) {
        checkBtn = document.createElement('button');
        checkBtn.className = 'btn reorder-check-btn ' + this.getBtnClass();
        checkBtn.textContent = t('check');
        checkBtn.addEventListener('click', () => this.checkReorder());
        area.appendChild(checkBtn);
      }
      checkBtn.disabled = false;
    }
  }
  selectBasic(index, btn, event) {
    if (this.answered) return;
    this.answered = true;
    const q = this.questions[this.current];
    const all = this.container.querySelectorAll('.option');
    all.forEach(o => o.classList.add('disabled'));
    if (index === q.correct) {
      btn.classList.add('correct');
      this.score++;
      state.correctAnswers = (state.correctAnswers || 0) + 1;
      this.el.feedback.textContent = t('correct') + ' ' + q.explain;
      this.el.feedback.classList.add('ok');
      this.rewardCorrect(event);
    } else {
      btn.classList.add('wrong');
      all[q.correct].classList.add('correct');
      this.el.feedback.textContent = t('incorrect') + ' ' + q.explain;
      this.el.feedback.classList.add('no');
    }
    state.answeredQuestions++; saveState(); updateHeader();
    this.el.nextBtn.disabled = false;
    this.el.progress.style.width = ((this.current + 1) / this.questions.length * 100) + '%';
  }
  checkInput() {
    if (this.answered || !this._inputEl) return;
    const q = this.questions[this.current];
    const ok = q.answers.some(a => normalize(a) === normalize(this._inputEl.value));
    this.answered = true;
    this._inputEl.disabled = true; this._checkBtnEl.disabled = true;
    const r = this._inputEl.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    if (ok) {
      this._inputEl.classList.add('correct');
      this.score++;
      state.correctAnswers = (state.correctAnswers || 0) + 1;
      this.el.feedback.textContent = t('correct') + ' ' + q.explain;
      this.el.feedback.classList.add('ok');
      this.rewardCorrect({ clientX: cx, clientY: cy });
    } else {
      this._inputEl.classList.add('wrong');
      this.el.feedback.textContent = `${t('answerWas')} ${q.answers[0]}. ${q.explain}`;
      this.el.feedback.classList.add('no');
    }
    state.answeredQuestions++; saveState(); updateHeader();
    this.el.nextBtn.disabled = false;
    this.el.progress.style.width = ((this.current + 1) / this.questions.length * 100) + '%';
  }
  checkReorder() {
    if (this.answered) return;
    const q = this.questions[this.current];
    const built = this._buildSelected.map(i => i.word).join(' ');
    const expected = q.words.join(' ');
    const ok = normalize(built) === normalize(expected);
    this.answered = true;
    this._builtEl.classList.add(ok ? 'correct' : 'wrong');
    this._poolEl.querySelectorAll('.word-chip').forEach(c => c.style.pointerEvents = 'none');
    this._builtEl.querySelectorAll('.word-chip').forEach(c => c.style.pointerEvents = 'none');
    const cb = this.container.querySelector('.reorder-check-btn');
    if (cb) cb.disabled = true;
    const r = this._builtEl.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    if (ok) {
      this.score++;
      state.correctAnswers = (state.correctAnswers || 0) + 1;
      this.el.feedback.textContent = t('correct') + ' ' + q.explain;
      this.el.feedback.classList.add('ok');
      this.rewardCorrect({ clientX: cx, clientY: cy });
    } else {
      this.el.feedback.textContent = `${t('rightAnswer')} ${expected}`;
      this.el.feedback.classList.add('no');
    }
    state.answeredQuestions++; saveState(); updateHeader();
    this.el.nextBtn.disabled = false;
    this.el.progress.style.width = ((this.current + 1) / this.questions.length * 100) + '%';
  }
  rewardCorrect(event) {
    const amount = this.getReward();
    this.earnedFuntiki += amount;
    const x = event?.clientX ?? window.innerWidth/2;
    const y = event?.clientY ?? window.innerHeight/2;
    addFuntiki(amount, x, y);
  }
  next() {
    this.current++;
    if (this.current < this.questions.length) this.loadQuestion();
    else this.showResult();
  }
  showResult() {
    this.el.gameScreen.classList.add('hidden');
    this.el.resultScreen.classList.remove('hidden');
    const total = this.questions.length;
    const percent = Math.round(this.score / total * 100);
    const isPerfect = this.score === total;

    // track attempts
    const attemptKey = this.kind + ':' + this.mode + ':' + this.testKey;
    state.attempts[attemptKey] = (state.attempts[attemptKey] || 0) + 1;
    state.lastPlayed[attemptKey] = Date.now();

    let storeKey, listKey;
    if (this.kind === 'grammar') {
      storeKey = this.mode === 'advanced' ? 'bestGrammarAdvanced' : 'bestGrammarBasic';
      listKey = this.mode === 'advanced' ? 'completedGrammarAdvanced' : 'completedGrammarBasic';
    } else {
      storeKey = 'bestBasic'; listKey = 'completedBasic';
      if (this.mode === 'advanced') { storeKey = 'bestAdvanced'; listKey = 'completedAdvanced'; }
      else if (this.mode.startsWith('exam')) { storeKey = 'bestExam'; listKey = 'completedExam'; }
      else if (this.mode.startsWith('ielts')) { storeKey = 'bestIelts'; listKey = 'completedIelts'; }
    }
    if (!state[storeKey][this.testKey] || state[storeKey][this.testKey] < this.score) state[storeKey][this.testKey] = this.score;
    if (!state[listKey].includes(this.testKey)) state[listKey].push(this.testKey);

    let bonus = 0;
    if (isPerfect) { bonus = this.getPerfectBonus(); state.totalFuntiki += bonus; }
    saveState(); updateHeader();

    let emoji, title, msg;
    if (percent === 100) { emoji = '🏆'; title = t('perfect'); msg = t('perfectMsg'); }
    else if (percent >= 70) { emoji = '🎉'; title = t('great'); msg = t('greatMsg'); }
    else if (percent >= 50) { emoji = '👍'; title = t('ok'); msg = t('okMsg'); }
    else { emoji = '📚'; title = t('repeat'); msg = t('repeatMsg'); }

    this.el.resultEmoji.textContent = emoji;
    this.el.resultTitle.textContent = title;
    this.el.resultScore.textContent = `${this.score} / ${total} (${percent}%)`;
    const totalEarned = this.earnedFuntiki + bonus;
    if (totalEarned > 0) {
      this.el.resultReward.classList.remove('hidden');
      this.el.resultReward.innerHTML = `<span>🐽</span><span>+${totalEarned} ${t('funtiki')}</span>${bonus ? `<span style="font-size:11.5px;opacity:0.8">${t('bonusForPerfect', {n: bonus})}</span>` : ''}`;
    } else this.el.resultReward.classList.add('hidden');
    this.el.resultMsg.textContent = msg;

    setTimeout(() => {
      bigCelebration();
      if (isPerfect) spawnBurst(window.innerWidth/2, window.innerHeight*0.3, { count: 30, emojis: ['🐽','⭐','✨','💫'], spread: 260, duration: 1500 });
    }, 150);
    setTimeout(() => checkAchievements(), 500);
  }
  restart() {
    this.current = 0; this.score = 0; this.earnedFuntiki = 0;
    this.el.progress.style.width = '0%';
    this.el.resultScreen.classList.add('hidden');
    this.el.gameScreen.classList.remove('hidden');
    this.loadQuestion();
  }
}

function pickRandom(arr, n) { return shuffle(arr).slice(0, n); }
function withSource(q, id) { return { ...q, _srcTense: id }; }
function buildExamQuestions(type) {
  if (type === 'exam-basic') {
    let pool = [];
    TENSES.forEach(tt => tt.basic.forEach(q => pool.push(withSource(q, tt.id))));
    GRAMMAR_TOPICS.forEach(g => g.basic.forEach(q => pool.push(withSource(q, g.id))));
    return pickRandom(pool, 15);
  }
  if (type === 'exam-advanced') {
    let pool = [];
    TENSES.forEach(tt => tt.advanced.forEach(q => pool.push(withSource(q, tt.id))));
    GRAMMAR_TOPICS.forEach(g => g.advanced.forEach(q => pool.push(withSource(q, g.id))));
    return pickRandom(pool, 10);
  }
  if (type === 'exam-mega') {
    let pool = [];
    TENSES.forEach(tt => {
      tt.basic.forEach(q => pool.push(withSource(q, tt.id)));
      tt.advanced.forEach(q => pool.push(withSource(q, tt.id)));
    });
    GRAMMAR_TOPICS.forEach(g => {
      g.basic.forEach(q => pool.push(withSource(q, g.id)));
      g.advanced.forEach(q => pool.push(withSource(q, g.id)));
    });
    return pickRandom(pool, 20);
  }
  return [];
}

/* =========================================================
   STATISTICS
   ========================================================= */
let statsFilter = 'all';

function buildStats() {
  const wrap = document.getElementById('statsWrap');
  wrap.innerHTML = `
    <h2>${t('statsTitle')}</h2>
    <p>${t('statsSub')}</p>
    <div id="statsContent"></div>
  `;
  renderStatsContent();
}

function getAccuracy() {
  if (!state.answeredQuestions) return 0;
  return Math.round((state.correctAnswers || 0) / state.answeredQuestions * 100);
}

function getTotalAttempts() {
  return Object.values(state.attempts).reduce((a, b) => a + b, 0);
}

function getTopicStats() {
  // returns array: { id, name, kind, bestBasic, bestAdvanced, attempts, lastPlayed }
  const result = [];
  TENSES.forEach(tt => {
    const attBasic = state.attempts['tense:basic:' + tt.id] || 0;
    const attAdv = state.attempts['tense:advanced:' + tt.id] || 0;
    const lastB = state.lastPlayed['tense:basic:' + tt.id] || 0;
    const lastA = state.lastPlayed['tense:advanced:' + tt.id] || 0;
    result.push({
      id: tt.id, name: tt.name, kind: 'tense',
      bestBasic: state.bestBasic[tt.id] || 0,
      bestAdvanced: state.bestAdvanced[tt.id] || 0,
      maxBasic: SESSION_BASIC, maxAdvanced: SESSION_ADVANCED,
      attempts: attBasic + attAdv,
      lastPlayed: Math.max(lastB, lastA)
    });
  });
  GRAMMAR_TOPICS.forEach(g => {
    const attBasic = state.attempts['grammar:basic:' + g.id] || 0;
    const attAdv = state.attempts['grammar:advanced:' + g.id] || 0;
    const lastB = state.lastPlayed['grammar:basic:' + g.id] || 0;
    const lastA = state.lastPlayed['grammar:advanced:' + g.id] || 0;
    const maxB = Math.min(SESSION_BASIC, g.basic.length);
    const maxA = Math.min(SESSION_ADVANCED, g.advanced.length);
    result.push({
      id: g.id, name: g.name, kind: 'grammar',
      bestBasic: state.bestGrammarBasic[g.id] || 0,
      bestAdvanced: state.bestGrammarAdvanced[g.id] || 0,
      maxBasic: maxB, maxAdvanced: maxA,
      attempts: attBasic + attAdv,
      lastPlayed: Math.max(lastB, lastA)
    });
  });
  return result;
}

function renderStatsContent() {
  const container = document.getElementById('statsContent');
  const totalAttempts = getTotalAttempts();
  const accuracy = getAccuracy();
  const topicStats = getTopicStats();
  const playedTopics = topicStats.filter(s => s.attempts > 0);

  // favourite & weakest (min 1 attempt)
  let favTopic = null, weakTopic = null;
  if (playedTopics.length) {
    favTopic = playedTopics.reduce((best, cur) => cur.attempts > (best?.attempts || 0) ? cur : best, null);
    // weakest by avg score (basic+advanced combined) among played
    const withScore = playedTopics.map(s => {
      const totalBest = s.bestBasic + s.bestAdvanced;
      const totalMax = s.maxBasic + s.maxAdvanced;
      return { ...s, avg: totalMax > 0 ? totalBest / totalMax : 0 };
    }).filter(s => s.attempts > 0);
    if (withScore.length) {
      weakTopic = withScore.reduce((w, cur) => cur.avg < (w?.avg ?? 999) ? cur : w, null);
    }
  }

  const accuracyClass = accuracy >= 80 ? 'good' : accuracy >= 50 ? 'medium' : accuracy > 0 ? 'low' : 'empty';
  const totalSections = playedTopics.length;
  const totalSectionsAll = TENSES.length + GRAMMAR_TOPICS.length;

  let html = '';

  // Overview tiles
  html += `
    <div class="stats-overview">
      <div class="stat-tile highlight">
        <div class="stat-tile-icon">🐽</div>
        <div class="stat-tile-value">${state.totalFuntiki}</div>
        <div class="stat-tile-label">${t('statFuntiki')}</div>
      </div>
      <div class="stat-tile">
        <div class="stat-tile-icon">📝</div>
        <div class="stat-tile-value">${state.answeredQuestions}</div>
        <div class="stat-tile-label">${t('statAnswers')}</div>
      </div>
      <div class="stat-tile">
        <div class="stat-tile-icon">🎯</div>
        <div class="stat-tile-value">${accuracy}%</div>
        <div class="stat-tile-label">${t('statAccuracy')}</div>
      </div>
      <div class="stat-tile">
        <div class="stat-tile-icon">🏆</div>
        <div class="stat-tile-value">${state.achievements.length} / ${ACHIEVEMENTS.length}</div>
        <div class="stat-tile-label">${t('statAchievements')}</div>
      </div>
    </div>
  `;

  if (!totalAttempts && !state.answeredQuestions) {
    html += `
      <div class="stats-empty">
        <div class="stats-empty-icon">${t('statsEmptyIcon')}</div>
        <div class="stats-empty-text">${t('statsEmpty')}</div>
      </div>
    `;
    container.innerHTML = html;
    return;
  }

  // Favourite / weakest
  if (favTopic || weakTopic) {
    html += `<div class="stats-section-title">⭐ ${t('statFavTopic')} / ${t('statWeakTopic')}</div>`;
    html += `<div class="stats-overview" style="grid-template-columns: 1fr 1fr;">`;
    if (favTopic) {
      html += `
        <div class="stat-tile">
          <div class="stat-tile-icon">💚</div>
          <div class="stat-tile-value" style="font-size:16px; line-height:1.3;">${favTopic.name}</div>
          <div class="stat-tile-label">${favTopic.attempts} ${t('attemptsLabel')}</div>
        </div>
      `;
    }
    if (weakTopic) {
      html += `
        <div class="stat-tile">
          <div class="stat-tile-icon">🎯</div>
          <div class="stat-tile-value" style="font-size:16px; line-height:1.3;">${weakTopic.name}</div>
          <div class="stat-tile-label">${Math.round(weakTopic.avg * 100)}% ${t('avgScore')}</div>
        </div>
      `;
    }
    html += `</div>`;
  }

  // Filter tabs
  html += `
    <div class="stats-section-title">📚 ${t('statSections')}</div>
    <div class="stats-tabs" id="statsTabs">
      <button class="stats-tab ${statsFilter === 'all' ? 'active' : ''}" data-filter="all">${t('statsFilterAll')}</button>
      <button class="stats-tab ${statsFilter === 'tense' ? 'active' : ''}" data-filter="tense">${t('statsFilterTenses')}</button>
      <button class="stats-tab ${statsFilter === 'grammar' ? 'active' : ''}" data-filter="grammar">${t('statsFilterGrammar')}</button>
    </div>
  `;

  // Filter topics
  let filtered = topicStats;
  if (statsFilter === 'tense') filtered = topicStats.filter(s => s.kind === 'tense');
  if (statsFilter === 'grammar') filtered = topicStats.filter(s => s.kind === 'grammar');

  html += `<div class="stats-list">`;
  filtered.forEach(s => {
    const bestB = s.bestBasic, bestA = s.bestAdvanced;
    const maxB = s.maxBasic, maxA = s.maxAdvanced;
    const pctB = maxB ? Math.round(bestB / maxB * 100) : 0;
    const pctA = maxA ? Math.round(bestA / maxA * 100) : 0;
    const totalScore = bestB + bestA;
    const totalMax = maxB + maxA;
    const totalPct = totalMax ? Math.round(totalScore / totalMax * 100) : 0;
    let scoreCls = 'empty';
    if (s.attempts > 0) {
      scoreCls = totalPct >= 80 ? 'good' : totalPct >= 50 ? 'medium' : 'low';
    }
    const icon = s.kind === 'tense' ? '🕰' : '📚';
    const attemptsLine = s.attempts
      ? `${s.attempts} ${t('attemptsLabel')}`
      : t('notPlayed');
    html += `
      <div class="stat-row">
        <div class="stat-row-header">
          <div class="stat-row-name"><span class="stat-row-icon">${icon}</span>${s.name}</div>
          <div class="stat-row-score ${scoreCls}">${totalScore} / ${totalMax}</div>
        </div>
        <div class="stat-bar-wrap">
          <div class="stat-bar basic" style="width:${pctB}%"></div>
          <div class="stat-bar advanced" style="width:${pctA}%"></div>
        </div>
        <div class="stat-row-detail">
          <span>📘 ${t('bestBasic')}: <b>${bestB}/${maxB}</b></span>
          <span>🔥 ${t('bestAdvanced')}: <b>${bestA}/${maxA}</b></span>
          <span>🎮 ${attemptsLine}</span>
        </div>
      </div>
    `;
  });
  html += `</div>`;

  // Exams summary
  const examItems = [
    { key: 'basic-exam', label: t('basicExam'), icon: '🎯', max: 15 },
    { key: 'advanced-exam', label: t('advExam'), icon: '🔥', max: 10 },
    { key: 'mega-exam', label: t('megaExam'), icon: '💪', max: 20 }
  ];
  const hasAnyExam = examItems.some(e => state.bestExam[e.key]);
  if (hasAnyExam) {
    html += `<div class="stats-section-title">🏁 ${t('statSectionExams')}</div>`;
    html += `<div class="stats-list">`;
    examItems.forEach(e => {
      const best = state.bestExam[e.key] || 0;
      const pct = Math.round(best / e.max * 100);
      let cls = 'empty';
      if (best > 0) cls = pct >= 80 ? 'good' : pct >= 50 ? 'medium' : 'low';
      const attempts = state.attempts['exam:' + (e.key === 'basic-exam' ? 'exam-basic' : e.key === 'advanced-exam' ? 'exam-advanced' : 'exam-mega') + ':' + e.key] || 0;
      html += `
        <div class="stat-row">
          <div class="stat-row-header">
            <div class="stat-row-name"><span class="stat-row-icon">${e.icon}</span>${e.label}</div>
            <div class="stat-row-score ${cls}">${best} / ${e.max}</div>
          </div>
          <div class="stat-bar-wrap"><div class="stat-bar basic" style="width:${pct}%"></div></div>
          <div class="stat-row-detail">
            <span>🎮 ${attempts || 0} ${t('attemptsLabel')}</span>
          </div>
        </div>
      `;
    });
    html += `</div>`;
  }

  container.innerHTML = html;

  // wire filter tabs
  container.querySelectorAll('.stats-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      statsFilter = tab.dataset.filter;
      renderStatsContent();
    });
  });
}

}

  document.getElementById('statsBtn').classList.remove('active');
  if (mode === 'tenses') {
    tensesMode.classList.remove('hidden');
    grammarMode.classList.add('hidden');
    document.querySelectorAll('#topicsWrap .topic').forEach(p => p.classList.remove('active'));
    const target = document.getElementById('topic-' + currentTenseId);
    if (target) target.classList.add('active');
    const app = document.getElementById('app');
    const tense = TENSES.find(tt => tt.id === currentTenseId);
    if (tense) { app.dataset.zone = tense.zone; document.body.dataset.zone = tense.zone; }
    setTimeout(() => updateTimelineMarker(true), 100);
  } else if (mode === 'grammar') {
    tensesMode.classList.add('hidden');
    grammarMode.classList.remove('hidden');
    document.getElementById('grammarGridView').classList.remove('hidden');
    document.querySelectorAll('#grammarTopicsWrap .topic').forEach(p => p.classList.remove('active'));
    const backBtn = document.getElementById('grammarBackBtn');
    if (backBtn) backBtn.classList.add('hidden');
    document.getElementById('app').dataset.zone = 'grammar';
    document.body.dataset.zone = 'grammar';
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
document.querySelectorAll('.mode-switcher button').forEach(btn => {
  btn.addEventListener('click', () => {
    switchMode(btn.dataset.mode);
    const r = btn.getBoundingClientRect();
    spawnBurst(r.left + r.width/2, r.top + r.height/2, { count: 12, emojis: btn.dataset.mode === 'grammar' ? ['📚','✨'] : ['🕰','✨'], spread: 130, duration: 800 });
  });
});

/* =========================================================
   SHARE
   ========================================================= */
function generateShareText(extra) {
  const achi = state.achievements.length;
  const achText = achi === 1 ? t('achSingular', { n: achi }) : t('achPlural', { n: achi });
  return t('shareText', { avatar: state.avatar || '🐷', name: state.name || t('guest'), score: state.totalFuntiki, ach: achText }) +
    (extra ? ` ${extra}` : '') + `\n${t('challenge')}`;
}
async function shareApp(extra) {
  const text = generateShareText(extra);
  const shareData = { title: 'English Grammar', text: text, url: location.href };
  try {
    if (navigator.share) {
      await navigator.share(shareData);
      spawnBurst(window.innerWidth / 2, window.innerHeight / 2, { count: 15, emojis: ['📤','✨','🐽'], spread: 150 });
    } else {
      await navigator.clipboard.writeText(text + '\n' + location.href);
      showToast({ icon: '📋', title: t('copied'), desc: t('copiedDesc') });
    }
  } catch {
    try {
      await navigator.clipboard.writeText(text + '\n' + location.href);
      showToast({ icon: '📋', title: t('copied'), desc: t('copiedDesc') });
    } catch {}
  }
}
function shareResult(quiz) {
  const total = quiz.questions.length;
  const percent = Math.round(quiz.score / total * 100);
  shareApp(t('resultShareExtra', { score: quiz.score, total, percent }));
}
document.getElementById('shareBtn').addEventListener('click', () => shareApp());

/* =========================================================
   ACHIEVEMENTS MODAL
   ========================================================= */
function renderAchievements() {
  const grid = document.getElementById('achGrid');
  grid.innerHTML = '';
  ACHIEVEMENTS.forEach(a => {
    const unlocked = state.achievements.includes(a.id);
    const card = document.createElement('div');
    card.className = 'ach-card ' + (unlocked ? 'unlocked' : 'locked');
    card.innerHTML = `
      ${!unlocked ? '<span class="ach-locked-tag">🔒</span>' : ''}
      <div class="ach-icon">${a.icon}</div>
      <div class="ach-name">${achName(a)}</div>
      <div class="ach-desc">${achDesc(a)}</div>
      <div class="ach-reward">+${a.reward} 🐽</div>
    `;
    grid.appendChild(card);
  });
  document.getElementById('achModalSub').innerHTML = `${t('collected')} <b>${state.achievements.length}</b> ${t('of')} <b>${ACHIEVEMENTS.length}</b>`;
  document.getElementById('achModalTitle').textContent = t('achievementsTitle');
  document.getElementById('closeAchBtn').textContent = t('close');
}
document.getElementById('achBtn').addEventListener('click', () => {
  renderAchievements();
  document.getElementById('achModal').classList.remove('hidden');
  document.getElementById('achBtn').classList.remove('has-new');
});
document.getElementById('closeAchBtn').addEventListener('click', () => {
  document.getElementById('achModal').classList.add('hidden');
});
document.getElementById('achModal').addEventListener('click', (e) => {
  if (e.target.id === 'achModal') document.getElementById('achModal').classList.add('hidden');
});

/* =========================================================
   WELCOME
   ========================================================= */
const welcomeModal = document.getElementById('welcomeModal');
const nameInput = document.getElementById('nameInput');
const startBtn = document.getElementById('startBtn');
const emojiGrid = document.getElementById('emojiGrid');
let pickedEmoji = '🐷';
let editing = false;

function buildEmojiPicker() {
  emojiGrid.innerHTML = '';
  AVAILABLE_EMOJIS.forEach(e => {
    const btn = document.createElement('button');
    btn.className = 'emoji-opt';
    btn.textContent = e;
    btn.dataset.emoji = e;
    if (e === pickedEmoji) btn.classList.add('selected');
    btn.addEventListener('click', () => {
      pickedEmoji = e;
      emojiGrid.querySelectorAll('.emoji-opt').forEach(b => b.classList.toggle('selected', b.dataset.emoji === e));
      document.getElementById('welcomeEmoji').textContent = e;
      const r = btn.getBoundingClientRect();
      spawnBurst(r.left + r.width/2, r.top + r.height/2, { count: 6, emojis: [e, '✨'], spread: 60, duration: 600 });
    });
    emojiGrid.appendChild(btn);
  });
}
function showWelcome(editMode = false) {
  editing = editMode;
  pickedEmoji = state.avatar || '🐷';
  nameInput.value = state.name || '';
  document.getElementById('welcomeEmoji').textContent = pickedEmoji;
  document.getElementById('welcomeTitle').textContent = t('welcomeTitle');
  document.getElementById('welcomeSub').innerHTML = editMode ? t('welcomeSubEdit') : t('welcomeSub');
  document.getElementById('emojiLabel').textContent = t('pickAvatar');
  nameInput.placeholder = state.lang === 'ru' ? 'Твоё имя...' : 'Your name...';
  startBtn.textContent = editMode ? t('saveBtn') : t('goBtn');
  buildEmojiPicker();
  welcomeModal.classList.remove('hidden');
  setTimeout(() => nameInput.focus(), 200);
}
function commitName() {
  const name = nameInput.value.trim().slice(0, 20);
  if (name.length < 1) {
    nameInput.style.borderColor = '#e53935';
    nameInput.style.boxShadow = '0 0 0 4px rgba(229,57,53,0.15)';
    return;
  }
  state.name = name;
  state.avatar = pickedEmoji;
  saveState();
  welcomeModal.classList.add('hidden');
  updateHeader();
  if (!editing) {
    spawnBurst(window.innerWidth / 2, window.innerHeight * 0.4, { count: 24, emojis: ['🐽','🎉','✨','⭐'], spread: 240, duration: 1400 });
  } else {
    showToast({ icon: '✓', title: t('saved'), desc: t('savedDesc') });
  }
  checkAchievements();
}
startBtn.addEventListener('click', commitName);
nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') commitName(); });
nameInput.addEventListener('input', () => {
  nameInput.style.borderColor = '';
  nameInput.style.boxShadow = '';
});
document.getElementById('avatar').addEventListener('click', () => showWelcome(true));

/* =========================================================
   LANGUAGE
   ========================================================= */
function applyLanguage() {
  document.documentElement.lang = state.lang;
  document.getElementById('langBtn').textContent = state.lang === 'ru' ? 'EN' : 'RU';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  const tBtn = document.querySelector('.mode-switcher button[data-mode="tenses"]');
  const gBtn = document.querySelector('.mode-switcher button[data-mode="grammar"]');
  if (tBtn) tBtn.textContent = t('modeTenses');
  if (gBtn) gBtn.textContent = t('modeGrammar');
  updateHeader();
  buildTimeline();
  buildTopics();
  buildGrammarGrid();
  buildGrammarTopicsWrap();
  buildExams();
  buildIelts();
  if (currentMode === 'tenses') {
    document.querySelectorAll('#topicsWrap .topic').forEach(p => p.classList.remove('active'));
    document.getElementById('topic-' + currentTenseId).classList.add('active');
    document.querySelectorAll('.tense-btn').forEach(b => b.classList.toggle('active', b.dataset.id === currentTenseId));
    setTimeout(() => updateTimelineMarker(false), 60);
  }
  if (!document.getElementById('statsWrap').classList.contains('hidden')) buildStats();
  document.getElementById('examsBtn').title = t('exams');
  document.getElementById('ieltsBtn').title = t('ielts');
  document.getElementById('shareBtn').title = t('shareBtn');
  document.getElementById('achBtn').title = t('achievementsTitle');
  document.getElementById('statsBtn').title = t('statsTitle');
  switchMode(currentMode);
}
document.getElementById('langBtn').addEventListener('click', () => {
  state.lang = state.lang === 'ru' ? 'en' : 'ru';
  saveState();
  applyLanguage();
  spawnBurst(window.innerWidth - 60, 60, { count: 12, emojis: ['🌐','✨'], spread: 100, duration: 800 });
});

/* =========================================================
   BOOT
   ========================================================= */
buildTimeline();
buildTopics();
buildGrammarGrid();
buildGrammarTopicsWrap();
buildExams();
buildIelts();
buildStats();
applyLanguage();
updateHeader();

const initial = TENSES.find(tt => tt.id === currentTenseId);
if (initial) {
  document.getElementById('app').dataset.zone = initial.zone;
  document.body.dataset.zone = initial.zone;
  document.querySelectorAll('#topicsWrap .topic').forEach(p => p.classList.remove('active'));
  document.getElementById('topic-' + currentTenseId).classList.add('active');
  document.querySelectorAll('.tense-btn').forEach(b => b.classList.toggle('active', b.dataset.id === currentTenseId));
}
setTimeout(() => updateTimelineMarker(false), 100);
window.addEventListener('resize', () => setTimeout(() => updateTimelineMarker(false), 80));

if (!state.name) {
  setTimeout(() => showWelcome(false), 200);
} else {
  markNewAchievement();
}
</script>
</body>
</html>
